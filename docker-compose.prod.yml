services:
  redis:
    image: redis:7-alpine
    container_name: ieltszone-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    image: ieltszone-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: ieltszone-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ${IELTSZONE_ENV_FILE:-.env.production}
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  speaking-worker:
    image: ieltszone-backend:latest
    container_name: ieltszone-speaking-worker
    restart: unless-stopped
    stop_grace_period: 150s
    command: ["npm", "run", "worker"]
    env_file:
      - ${IELTSZONE_ENV_FILE:-.env.production}
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        # Lấy từ file .env.production trên Server lúc build
        - VITE_API_URL=${VITE_API_URL}
    container_name: ieltszone-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  redis_data:
